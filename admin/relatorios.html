<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Relatórios — Admin CCS</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo" style="padding:0 10px;margin-bottom:30px;font-size:1.1rem">CLEYTON CASANOVA</div>
    <nav class="admin-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="produtos.html">🛒 Produtos</a>
      <a href="pedidos.html">📦 Pedidos</a>
      <a href="clientes.html">👥 Clientes</a>
      <a href="relatorios.html" class="activo">📈 Relatórios</a>
    </nav>
    <div style="margin-top:auto;padding-top:30px">
      <p style="font-size:.75rem;color:var(--cinza-texto);padding:0 10px" id="admin-email"></p>
      <button id="btn-logout" class="btn btn-secundario" style="width:100%;margin-top:10px">Sair</button>
    </div>
  </aside>
  <main class="admin-main">
    <h1 class="titulo-seccao" style="font-size:2rem">Relatórios</h1>
    <div class="linha-dourada"></div>
    <div style="display:flex;gap:10px;margin:20px 0;flex-wrap:wrap">
      <input type="date" id="data-inicio" style="padding:10px 14px;background:var(--cinza);border:1px solid var(--cinza-linha);border-radius:10px;color:var(--branco)">
      <input type="date" id="data-fim" style="padding:10px 14px;background:var(--cinza);border:1px solid var(--cinza-linha);border-radius:10px;color:var(--branco)">
      <button class="btn btn-primario" id="btn-filtrar">Filtrar</button>
      <button class="btn btn-secundario" id="btn-csv">⬇ Exportar CSV</button>
      <button class="btn btn-secundario" id="btn-print">🖨 Imprimir</button>
    </div>
    <div id="relatorio-conteudo">A carregar…</div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/cliente-auth.js"></script>
<script src="js/notificacao-modal.js"></script>
</body>
</html>
