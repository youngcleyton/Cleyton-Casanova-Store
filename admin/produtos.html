<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Produtos — Admin CCS</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo" style="padding:0 10px;margin-bottom:30px;font-size:1.1rem">CLEYTON CASANOVA</div>
    <nav class="admin-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="produtos.html" class="activo">🛒 Produtos</a>
      <a href="pedidos.html">📦 Pedidos</a>
      <a href="clientes.html">👥 Clientes</a>
      <a href="relatorios.html">📈 Relatórios</a>
    </nav>
    <div style="margin-top:auto;padding-top:30px">
      <p style="font-size:.75rem;color:var(--cinza-texto);padding:0 10px" id="admin-email"></p>
      <button id="btn-logout" class="btn btn-secundario" style="width:100%;margin-top:10px">Sair</button>
    </div>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
      <h1 class="titulo-seccao" style="font-size:2rem">Produtos</h1>
      <button class="btn btn-primario" id="btn-novo">+ Novo Produto</button>
    </div>
    <div class="linha-dourada"></div>
    <div id="tabela-produtos">A carregar…</div>
  </main>
</div>

<!-- MODAL PRODUTO -->
<div class="modal-fundo" id="modal-produto">
  <div class="modal-box">
    <h2 id="modal-titulo">Novo Produto</h2>
    <form class="form-admin" id="form-produto">
      <input type="hidden" id="prod-id" />
      <div><label>Nome</label><input type="text" id="prod-nome" required /></div>
      <div><label>Slug (URL)</label><input type="text" id="prod-slug" required placeholder="ex: sns-strass-dentario" /></div>
      <div class="linha-2">
        <div><label>Categoria</label>
          <select id="prod-categoria"></select>
        </div>
        <div><label>Stock</label><input type="number" id="prod-stock" min="0" value="0" required /></div>
      </div>
      <div class="linha-2">
        <div><label>Preço Original (MZN)</label><input type="number" step="0.01" id="prod-preco" min="0" required /></div>
        <div><label>Preço Promocional (MZN)</label><input type="number" step="0.01" id="prod-promo" min="0" /></div>
      </div>
      <div><label>Descrição curta</label><textarea id="prod-curta" rows="2"></textarea></div>
      <div><label>Descrição completa</label><textarea id="prod-descricao" rows="4"></textarea></div>
      <div><label>Características (uma por linha)</label><textarea id="prod-carac" rows="4"></textarea></div>
      <div><label>Activo</label>
        <select id="prod-activo"><option value="true">Sim</option><option value="false">Não</option></select>
      </div>
      <div>
        <label>Imagens</label>
        <input type="file" id="prod-imagens-input" accept="image/*" multiple />
        <div class="upload-imagens" id="prod-imagens-prev" style="margin-top:10px"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button type="submit" class="btn btn-primario" style="flex:1">Guardar</button>
        <button type="button" class="btn btn-secundario" onclick="document.getElementById('modal-produto').classList.remove('aberto')">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/produtos.js"></script>
<script src="js/cliente-auth.js"></script>
<script src="js/notificacao-modal.js"></script>
</body>
</html>
