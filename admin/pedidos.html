<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Pedidos — Admin CCS</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo" style="padding:0 10px;margin-bottom:30px;font-size:1.1rem">CLEYTON CASANOVA</div>
    <nav class="admin-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="produtos.html">🛒 Produtos</a>
      <a href="pedidos.html" class="activo">📦 Pedidos</a>
      <a href="clientes.html">👥 Clientes</a>
      <a href="relatorios.html">📈 Relatórios</a>
    </nav>
    <div style="margin-top:auto;padding-top:30px">
      <p style="font-size:.75rem;color:var(--cinza-texto);padding:0 10px" id="admin-email"></p>
      <button id="btn-logout" class="btn btn-secundario" style="width:100%;margin-top:10px">Sair</button>
    </div>
  </aside>
  <main class="admin-main">
    <h1 class="titulo-seccao" style="font-size:2rem">Pedidos</h1>
    <div class="linha-dourada"></div>
    <div style="display:flex;gap:10px;margin:20px 0;flex-wrap:wrap">
      <select id="filtro-estado" style="padding:10px 14px;background:var(--cinza);border:1px solid var(--cinza-linha);border-radius:10px;color:var(--branco)">
        <option value="">Todos os estados</option>
        <option value="pendente">Pendente</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <button class="btn btn-secundario" id="btn-refresh">↻ Actualizar</button>
    </div>
    <div id="tabela-pedidos">A carregar…</div>
  </main>
</div>

<div class="modal-fundo" id="modal-pedido">
  <div class="modal-box" id="modal-pedido-box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/cliente-auth.js"></script>
<script src="js/notificacao-modal.js"></script>
</body>
</html>
