<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Admin — CLEYTON CASANOVA STORE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at top right, rgba(212,175,55,0.10), transparent 60%), #0a0a0a;
    padding: 20px;
  }
  .login-card {
    width: 100%; max-width: 420px; padding: 48px 40px 36px;
    background: linear-gradient(160deg, #121212 0%, #0a0a0a 100%);
    border: 1px solid var(--cinza-linha); border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
  }
  .brand-login { text-align: center; margin-bottom: 34px; }
  .brand-login .logo {
    font-family: var(--fonte-titulo); font-size: 1.4rem; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--dourado-claro), var(--dourado), var(--dourado-escuro));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;
  }
  .brand-login .subtitulo {
    color: var(--dourado); text-transform: uppercase; letter-spacing: 4px; font-size: 0.68rem; margin-top: 10px;
  }
  .campo-login { margin-bottom: 18px; }
  .campo-login label {
    display: block; font-size: 0.72rem; color: var(--cinza-texto);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
  }
  .campo-login input {
    width: 100%; background: var(--cinza); border: 1px solid var(--cinza-linha);
    border-radius: 10px; padding: 14px 16px; color: var(--branco); font-size: 0.95rem; transition: var(--transicao);
  }
  .campo-login input:focus {
    outline: none; border-color: var(--dourado); box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
  }
  .btn-login {
    width: 100%; margin-top: 24px; padding: 16px; border-radius: 999px;
    background: linear-gradient(135deg, var(--dourado-claro), var(--dourado), var(--dourado-escuro));
    color: var(--preto); font-weight: 700; letter-spacing: 0.8px; font-size: 0.95rem;
    transition: var(--transicao); cursor: pointer; border: none;
  }
  .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 45px rgba(212, 175, 55, 0.5); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .mensagem-erro { color: #ff5252; font-size: 0.85rem; text-align: center; margin-top: 16px; min-height: 1.2em; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000; border-radius: 50%; animation: girar 0.7s linear infinite; margin-right: 8px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-login">
    <div class="logo">CLEYTON CASANOVA</div>
    <div class="subtitulo">Painel Administrativo</div>
  </div>

  <form id="form-login">
    <div class="campo-login">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="admin@cleytoncasanova.com" />
    </div>
    <div class="campo-login">
      <label for="password">Palavra-passe</label>
      <input type="password" id="password" required placeholder="••••••••" />
    </div>
    <button type="submit" class="btn-login" id="btn-entrar">Entrar</button>
    <p class="mensagem-erro" id="erro-login"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script>
(function () {
  const form = document.getElementById("form-login");
  const btn = document.getElementById("btn-entrar");
  const errEl = document.getElementById("erro-login");

  // Se já tem sessão, vai direto para o dashboard
  window.sb.auth.getSession().then(({ data }) => {
    if (data?.session) location.href = "dashboard.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.textContent = "";
    
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>A entrar…';

    try {
      // Login DIRETO no Supabase (Sem Edge Functions)
      const { data, error } = await window.sb.auth.signInWithPassword({ email, password });

      if (error) {
        throw new Error("Email ou palavra-passe incorretos.");
      }

      // Sucesso
      location.href = "dashboard.html";

    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
})();
</script>
</body>
</html>
