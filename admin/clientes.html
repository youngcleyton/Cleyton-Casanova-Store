<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Clientes — Admin CCS</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo" style="padding:0 10px;margin-bottom:30px;font-size:1.1rem">CLEYTON CASANOVA</div>
    <nav class="admin-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="produtos.html">🛒 Produtos</a>
      <a href="pedidos.html">📦 Pedidos</a>
      <a href="clientes.html" class="activo">👥 Clientes</a>
      <a href="relatorios.html">📈 Relatórios</a>
    </nav>
    <div style="margin-top:auto;padding-top:30px">
      <p style="font-size:.75rem;color:var(--cinza-texto);padding:0 10px" id="admin-email"></p>
      <button id="btn-logout" class="btn btn-secundario" style="width:100%;margin-top:10px">Sair</button>
    </div>
  </aside>
  <main class="admin-main">
    <h1 class="titulo-seccao" style="font-size:2rem">Clientes</h1>
    <div class="linha-dourada"></div>
    <div id="tabela-clientes" style="margin-top:20px">A carregar…</div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="js/auth-guard.js"></script>
<script>
(async function () {
  await new Promise(r => setTimeout(r, 400));
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session) return;
  const cont = document.getElementById("tabela-clientes");
  const { data, error } = await window.sb.from("customers").select("*").order("total_compras", { ascending: false });
  if (error) { cont.innerHTML = "Erro: " + error.message; return; }
  if (!data.length) { cont.innerHTML = "<p>Sem clientes ainda.</p>"; return; }
  cont.innerHTML = `
    <table class="tabela-admin">
      <thead><tr><th>Nome</th><th>WhatsApp</th><th>Compras</th><th>Total gasto</th><th>Desconto</th><th>Desde</th></tr></thead>
      <tbody>
      ${data.map(c => `
        <tr>
          <td>${CCS.escapeHTML(c.nome || "—")} ${c.total_compras > 1 ? '<span class="estado-tag confirmado" style="margin-left:6px">recorrente</span>' : ""}</td>
          <td>${CCS.escapeHTML(c.whatsapp)}</td>
          <td>${c.total_compras}</td>
          <td>${CCS.formatarPreco(c.total_gasto)}</td>
          <td>${c.desconto_atual}%</td>
          <td>${new Date(c.criado_em).toLocaleDateString("pt-PT")}</td>
        </tr>
      `).join("")}
      </tbody>
    </table>`;
})();
</script>
<script src="js/cliente-auth.js"></script>
<script src="js/notificacao-modal.js"></script>
</body>
</html>
