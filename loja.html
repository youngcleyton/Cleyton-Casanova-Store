<head>

<body>
<div id="loader"><div class="anel"></div></div>

<header class="header">
  <div class="container">
    <a href="index.html" class="logo">CLEYTON CASANOVA</a>
    <nav class="nav">

    </nav>

  </div>
</header>

<section class="seccao" style="padding-top:150px">
  <div class="container">
    <div class="cabecalho-seccao reveal">
      <p class="subtitulo">Colecção exclusiva</p>
      <h1 class="titulo-seccao">A Nossa <span class="dourado">Loja</span></h1>
      <div class="linha-dourada centro"></div>
    </div>

    <!-- BARRA DE FILTROS -->
    <div class="barra-filtros">
      <input type="search" id="pesquisa" placeholder="Pesquisar produtos…" />
      <select id="filtro-categoria"><option value="">Todas as categorias</option></select>
      <input type="number" id="filtro-preco" placeholder="Preço máx (MZN)" min="0" />
      <select id="filtro-disponivel">
        <option value="">Disponibilidade</option>
        <option value="1">Em stock</option>
        <option value="0">Esgotado</option>
      </select>
    </div>

    <div class="grelha-produtos" id="loja-grelha">
      <p style="grid-column:1/-1;text-align:center;color:var(--cinza-texto)">A carregar…</p>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-copy">© <span id="ano"></span> CLEYTON CASANOVA STORE</div>
  </div>
</footer>
