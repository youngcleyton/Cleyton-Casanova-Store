<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Contacto — CLEYTON CASANOVA STORE</title>
<link rel="stylesheet" href="css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
.form-contacto { max-width: 600px; margin: 0 auto; display: grid; gap: 16px; }
.form-contacto input, .form-contacto textarea {
  background: var(--preto-suave); border: 1px solid var(--cinza-linha);
  padding: 14px 18px; border-radius: 10px; color: var(--branco);
  font-family: inherit; font-size: .95rem; transition: var(--transicao);
}
.form-contacto input:focus, .form-contacto textarea:focus {
  outline: none; border-color: var(--dourado);
  box-shadow: 0 0 0 2px rgba(212,175,55,.15);
}
.form-contacto textarea { min-height: 140px; resize: vertical; }
</style>
</head>
<body>
<div id="loader"><div class="anel"></div></div>
<header class="header"><div class="container">
  <a href="index.html" class="logo">CLEYTON CASANOVA</a>
  <nav class="nav">
    <a href="index.html">Início</a><a href="sobre.html">Sobre</a>
    <a href="projetos.html">Projectos</a><a href="servicos.html">Serviços</a>
    <a href="loja.html">Loja</a><a href="contacto.html" class="activo">Contacto</a>
    <a href="carrinho.html" class="nav-carrinho">Carrinho <span class="badge vazio">0</span></a>
  </nav>
  <button class="menu-toggle"><span></span><span></span><span></span></button>
</div></header>

<section class="seccao" style="padding-top:150px">
  <div class="container">
    <div class="cabecalho-seccao reveal">
      <p class="subtitulo">Fala comigo</p>
      <h1 class="titulo-seccao">Entra em <span class="dourado">Contacto</span></h1>
      <div class="linha-dourada centro"></div>
    </div>
    <form class="form-contacto reveal" id="form-contacto">
      <input type="text" name="nome" placeholder="O teu nome" required />
      <input type="tel" name="whatsapp" placeholder="O teu WhatsApp" required />
      <input type="text" name="assunto" placeholder="Assunto" required />
      <textarea name="mensagem" placeholder="Escreve a tua mensagem…" required></textarea>
      <button type="submit" class="btn btn-primario btn-grande">Enviar via WhatsApp</button>
    </form>
  </div>
</section>

<footer class="footer"><div class="container"><div class="footer-copy">© <span id="ano"></span> CLEYTON CASANOVA STORE</div></div></footer>
<a class="whatsapp-flutuante" id="whatsapp-flutuante" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path fill="#fff" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.247-.694.247-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script>
<script>
document.getElementById("ano").textContent = new Date().getFullYear();
document.getElementById("whatsapp-flutuante").href = CCS.linkWhatsApp("Olá! Quero falar contigo.");
document.getElementById("form-contacto").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = `Olá Cleyton!%0A%0A*Nome:* ${encodeURIComponent(f.nome.value)}%0A*WhatsApp:* ${encodeURIComponent(f.whatsapp.value)}%0A*Assunto:* ${encodeURIComponent(f.assunto.value)}%0A%0A${encodeURIComponent(f.mensagem.value)}`;
  window.open(CCS.linkWhatsApp(decodeURIComponent(msg.replace(/%0A/g, "\n"))), "_blank");
});
</script>
</body>
</html>
